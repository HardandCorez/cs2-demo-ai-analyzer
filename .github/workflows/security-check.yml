name: Security and regression checks

on:
  push:
    branches: [main, 'security/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Node 22 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check project syntax
        run: npm run check
      - name: Check gateway syntax
        run: node --check gateway/src/server.js
      - name: Run security tests
        run: npm test
